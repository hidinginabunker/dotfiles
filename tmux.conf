set -g mouse on
set -g history-limit 50000
set -g focus-events on

# Forward modified keys (Shift+Enter, etc.) through tmux to apps like Claude Code
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Esc reaches vim and Claude Code at once (the default is 500 ms on older tmux).
set -s escape-time 10
# Copy in tmux reaches the local machine's clipboard over ssh (OSC 52), and apps can pass escape
# sequences through (Claude Code's tmux notes ask for it).
set -s set-clipboard on
set -g allow-passthrough on
# True colour.
set -as terminal-features 'xterm*:RGB'
